<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dettaglio Torneo — Tornei Calcistici</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="css/style.css" rel="stylesheet" />
</head>
<body>

  <!-- ── Navbar ── -->
  <nav class="navbar navbar-expand-lg navbar-dark navbar-calcio">
    <div class="container">
      <a class="navbar-brand" href="index.html">
        <i class="bi bi-trophy-fill"></i> Tornei Calcistici
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMain">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navMain">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link" href="index.html"><i class="bi bi-house-door"></i> Home</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container my-4">

    <!-- Breadcrumb -->
    <nav aria-label="breadcrumb" class="mb-3">
      <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="index.html">Home</a></li>
        <li class="breadcrumb-item active" id="bc-torneo">Torneo</li>
      </ol>
    </nav>

    <!-- ── Info Torneo ── -->
    <div class="section-card" id="sezione-info">
      <h5><i class="bi bi-info-circle"></i> Informazioni Torneo</h5>
      <div id="info-torneo">
        <div class="loading-spinner">
          <div class="spinner-border text-success" role="status"></div>
        </div>
      </div>
    </div>

    <!-- ── Squadre ── -->
    <div class="section-card">
      <h5><i class="bi bi-people-fill"></i> Squadre</h5>
      <form id="form-aggiungi-squadra" class="row g-2 align-items-end mb-3">
        <div class="col">
          <input type="text" class="form-control" id="input-squadra-nome" placeholder="Nome squadra" required />
        </div>
        <div class="col-auto">
          <button type="submit" class="btn btn-calcio">
            <i class="bi bi-plus-lg"></i> Aggiungi
          </button>
        </div>
      </form>
      <div id="lista-squadre">
        <div class="loading-spinner"><div class="spinner-border text-success" role="status"></div></div>
      </div>
    </div>

    <!-- ── Gironi ── -->
    <div class="section-card">
      <h5><i class="bi bi-diagram-3-fill"></i> Gironi</h5>
      <form id="form-genera-gironi" class="row g-2 align-items-end mb-3">
        <div class="col-auto">
          <label for="input-num-gironi" class="form-label mb-0">Numero gironi</label>
          <input type="number" class="form-control" id="input-num-gironi" value="2" min="1" max="26" style="width:100px" />
        </div>
        <div class="col-auto">
          <button type="submit" class="btn btn-calcio">
            <i class="bi bi-shuffle"></i> Genera Gironi
          </button>
        </div>
      </form>
      <div id="lista-gironi"></div>
    </div>

    <!-- ── Calendario / Partite ── -->
    <div class="section-card">
      <h5><i class="bi bi-calendar-event"></i> Calendario Partite</h5>
      <div class="mb-3">
        <button id="btn-genera-calendario" class="btn btn-calcio">
          <i class="bi bi-calendar-plus"></i> Genera Calendario
        </button>
      </div>
      <div id="lista-partite"></div>
    </div>

    <!-- ── Classifica ── -->
    <div class="section-card">
      <h5><i class="bi bi-bar-chart-fill"></i> Classifica</h5>
      <div class="mb-3">
        <label for="select-girone-classifica" class="form-label">Seleziona girone</label>
        <select id="select-girone-classifica" class="form-select" style="max-width:300px">
          <option value="">— scegli un girone —</option>
        </select>
      </div>
      <div id="classifica-container"></div>
    </div>

  </main>

  <footer class="text-center">
    <div class="container">
      SGTC — Sistema Gestione Tornei Calcistici &copy; 2026
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="js/torneo.js"></script>
</body>
</html>
