<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tornei Calcistici</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <!-- Custom CSS -->
  <link href="css/style.css" rel="stylesheet" />
  <link rel="icon" type="image/png" href="assets/ball.png"
</head>
<body>

  <!-- ── Navbar ── -->
  <nav class="navbar navbar-expand-lg navbar-dark navbar-calcio">
    <div class="container">
      <a class="navbar-brand" href="index.html">
        <i class="bi bi-trophy-fill"></i> Tornei Calcistici
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMain">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navMain">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link active" href="index.html"><i class="bi bi-house-door"></i> Home</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- ── Contenuto principale ── -->
  <main class="container my-4">

    <!-- Form creazione torneo -->
    <div class="section-card">
      <h5><i class="bi bi-plus-circle"></i> Crea Nuovo Torneo</h5>
      <form id="form-crea-torneo" class="row g-3 align-items-end">
        <div class="col-md-5">
          <label for="input-nome" class="form-label">Nome del torneo</label>
          <input type="text" class="form-control" id="input-nome" placeholder="es. Torneo Primavera" required />
        </div>
        <div class="col-md-3">
          <label for="input-anno" class="form-label">Anno</label>
          <input type="number" class="form-control" id="input-anno" value="2026" min="2000" max="2100" />
        </div>
        <div class="col-md-4">
          <button type="submit" class="btn btn-calcio w-100">
            <i class="bi bi-plus-lg"></i> Crea Torneo
          </button>
        </div>
      </form>
    </div>

    <!-- Lista tornei -->
    <div class="section-card">
      <h5><i class="bi bi-list-ul"></i> I Tuoi Tornei</h5>
      <div id="lista-tornei">
        <div class="loading-spinner">
          <div class="spinner-border text-success" role="status">
            <span class="visually-hidden">Caricamento...</span>
          </div>
        </div>
      </div>
    </div>

  </main>

  <!-- ── Footer ── -->
  <footer class="text-center ">
    <div class="container">
      SGTC — Sistema Gestione Tornei Calcistici &copy; 2026
    </div>
  </footer>

  <!-- Bootstrap 5 JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- App JS -->
  <script type="module" src="js/tornei.js"></script>
</body>
</html>
