<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dettaglio Squadra — Tornei Calcistici</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="css/style.css" rel="stylesheet" />
</head>
<body>

  <!-- ── Navbar ── -->
  <nav class="navbar navbar-expand-lg navbar-dark navbar-calcio">
    <div class="container">
      <a class="navbar-brand" href="index.html">
        <i class="bi bi-trophy-fill"></i> Tornei Calcistici
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMain">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navMain">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link" href="index.html"><i class="bi bi-house-door"></i> Home</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container my-4">

    <!-- Breadcrumb -->
    <nav aria-label="breadcrumb" class="mb-3">
      <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="index.html">Home</a></li>
        <li class="breadcrumb-item"><a href="#" id="bc-torneo-link">Torneo</a></li>
        <li class="breadcrumb-item active" id="bc-squadra">Squadra</li>
      </ol>
    </nav>

    <!-- ── Info squadra ── -->
    <div class="section-card">
      <h5><i class="bi bi-shield-fill"></i> <span id="nome-squadra">Squadra</span></h5>
      <p class="text-muted mb-0" id="info-squadra"></p>
    </div>

    <!-- ── Aggiungi giocatore ── -->
    <div class="section-card">
      <h5><i class="bi bi-person-plus-fill"></i> Aggiungi Giocatore</h5>
      <form id="form-giocatore" class="row g-2 align-items-end">
        <div class="col-md-3">
          <label class="form-label">Nome</label>
          <input type="text" class="form-control" id="input-g-nome" placeholder="Mario" required />
        </div>
        <div class="col-md-3">
          <label class="form-label">Cognome</label>
          <input type="text" class="form-control" id="input-g-cognome" placeholder="Rossi" required />
        </div>
        <div class="col-md-2">
          <label class="form-label">N° Maglia</label>
          <input type="number" class="form-control" id="input-g-maglia" placeholder="10" min="1" max="99" />
        </div>
        <div class="col-md-4">
          <button type="submit" class="btn btn-calcio w-100">
            <i class="bi bi-plus-lg"></i> Aggiungi Giocatore
          </button>
        </div>
      </form>
    </div>

    <!-- ── Lista giocatori ── -->
    <div class="section-card">
      <h5><i class="bi bi-people"></i> Rosa Giocatori</h5>
      <div id="lista-giocatori">
        <div class="loading-spinner"><div class="spinner-border text-success" role="status"></div></div>
      </div>
    </div>

    <!-- Bottone torna al torneo -->
    <a href="#" id="btn-torna-torneo" class="btn btn-outline-calcio">
      <i class="bi bi-arrow-left"></i> Torna al Torneo
    </a>

  </main>

  <footer class="text-center">
    <div class="container">
      SGTC — Sistema Gestione Tornei Calcistici &copy; 2026
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="js/squadra.js"></script>
</body>
</html>
